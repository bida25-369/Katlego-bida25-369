    <body>   
        <article class="feedback">
        <form autocomplete="off" class="form">
            <p class="title">Feedback</p>
            <p class="form-message">Feel free to give any feedback concerning inquiries and suggestions for the website or feel free to visit our dealership</p>
            <div class="form-group">
                <label>
                    <input type="text" required>
                    <span>Name</span>
                </label>
                <label>
                    <input type="text" required>
                    <span>Surname</span>
                </label>
            </div>
            <label>
                <input id="number" type="number" required>
                <span>Contact No</span>
                <button class="submit" type="button" onclick="myFunction()">Validate</button>
                <p id="demo"></p>
            </label>
            <label>
                <input type="text" required>
                <span>Email Address</span>
            </label>
            <label>
                <input type="text" required>
                <span>Feedback/Suggestions</span>
            </label>
            <button class="submit">Submit</button>
        </form>

        <script>
        function myFunction() 
            let x = document.getElementById("number").value;
             let text;
            if (isNaN(x) || x.length !==8) {
            text = "Input not valid, 8 digit phone number required";
            } else {
            text = "Input OK";
             }
            document.getElementById("demo").innerHTML = text;
            }
        </script>
    </article>
